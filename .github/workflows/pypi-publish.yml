name: Publish accepted v0.5.0 distributions

on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: SHA256 of the EC-accepted pypi-manifest.json (recorded before dispatch)
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-ledgerwash-v050
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'taipei49314/ledgerwash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify exact accepted bytes without building or executing distributions
        env:
          ACCEPTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: python -I -B workloads/source_release_verify/prepare_publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-v050
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ledgerwash/0.5.0/
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: accepted-v050
          path: release/
      - name: Verify transfer checksums
        working-directory: release
        run: sha256sum --strict --check SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/dist/
          verify-metadata: true
          skip-existing: false
          attestations: true
