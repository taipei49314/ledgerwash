[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerwash"
version = "0.1.0"
description = "Flags mechanically-checkable patterns of weakened evidence in agent work ledgers and handoff receipts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "taipei49314" }]
keywords = ["ai-agent", "audit", "receipts", "evidence", "reward-hacking"]
# Zero runtime dependencies is a product feature, not an accident (checkwash D-001 convention).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ledgerwash = "ledgerwash.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerwash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
